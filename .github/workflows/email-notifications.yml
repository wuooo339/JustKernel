name: push email notification

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: push-email-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    # One notification per push, after the complete OS matrix finishes. Ignore
    # PR checks, forks and reruns. This file lives on the default branch so it
    # also observes checks from refactor and other repository branches.
    if: >-
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run can access secrets: always execute trusted default-branch
      # code, never the triggering branch or its uploaded artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check mail delivery code without sending mail
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Send commit and checks summary
        run: python3 .github/scripts/notify_push.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || 'gresces@foxmail.com' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'ssl' }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
