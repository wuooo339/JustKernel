name: 开发任务
description: 团队分工或外部贡献
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 要解决的问题、涉及模块及预期行为。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 可重复的检查；是否需要真实模型、CANN 或 NPU？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 不要上传凭据、SSH 配置或私人运行记录。
