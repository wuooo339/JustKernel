[project]
name = "aworker"
version = "0.2.0"
description = "JustKernel: observable Deep Agents teams for Ascend kernel engineering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.2.2",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "deepagents==0.7.25",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-deepseek>=1.1.1",
    "langchain-openai==1.7.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.8",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "sse-starlette>=3.5.0",
    "starlette>=1.8.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
justkernel = "aworker.lab.cli:main"
justkernel-next = "justkernel.bootstrap.cli:main"
aworker = "aworker.cli:main"
aworker-lab = "aworker.lab.cli:main"

[project.optional-dependencies]
simulator = [
    "numpy>=2,<3",
    "torch==2.14.1+cpu ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pillow>=13.0.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justkernel", "src/aworker"]

[tool.hatch.build]
exclude = [
    "src/aworker/lab/resources/confusion_mul_grad/project/**",
    "src/aworker/lab/resources/rotary_pos_emb/kernel.asc",
    "docs/images/execution-record.png", "docs/images/simulation.png",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/examples", "/tools", "/.github",
    "/AGENTS.md", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md",
    "/pyproject.toml", "/uv.lock", "/models.toml", "/.env.example", "/.gitignore", "/.gitattributes",
    "/.python-version", "/start.ps1", "/restart.ps1", "/start.sh", "/start.command",
    "/启动演示.cmd", "/重启面板.cmd",
    "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/aworker/lab/resources/confusion_mul_grad/project"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["justkernel", "aworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.justkernel-test-tmp"

[tool.mypy]
python_version = "3.13"
files = ["src/justkernel"]
strict = true
warn_unused_ignores = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
