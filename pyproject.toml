[project]
name = "justkernel"
version = "0.1.0"
description = "JustKernel v2 independent implementation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
justkernel = "justkernel.bootstrap.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justkernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["justkernel"]

[tool.mypy]
python_version = "3.13"
files = ["src/justkernel"]
strict = true
warn_unused_ignores = true
