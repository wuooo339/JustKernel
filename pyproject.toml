[project]
name = "justkernel"
version = "0.1.0"
description = "JustKernel v2 independent implementation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "pyyaml>=6.0",
]

[project.scripts]
justkernel = "justkernel.bootstrap.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justkernel"]

[tool.hatch.build.targets.sdist]
include = [
  "src/justkernel",
  "tests",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "uv.lock",
]
exclude = [
  ".codegraph", "3q", "opencode.jsonc", "AGENTS.md", ".env", "dist",
  ".gitignore", ".gitattributes", ".python-version", "SPEC",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["justkernel"]

[tool.mypy]
python_version = "3.13"
files = ["src/justkernel"]
strict = true
warn_unused_ignores = true
