[project]
name = "justkernel"
version = "0.1.0"
description = "JustKernel: a single-operator agent cluster for Ascend kernel engineering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.2.2",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "deepagents==0.7.25",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-deepseek>=1.1.1",
    "langchain-openai==1.7.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.8",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "sse-starlette>=3.5.0",
    "starlette>=1.8.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
justkernel = "justkernel.bootstrap.cli:main"

[project.optional-dependencies]
simulator = [
    "numpy>=2,<3",
    "torch==2.14.1+cpu ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pillow>=13.0.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justkernel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/SPEC",
    "/TODO.md",
    "/AGENTS.md",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
    "/.gitattributes",
    "/.python-version",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["justkernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.justkernel-test-tmp"
pythonpath = ["src", "../JustKernel/src"]

[tool.mypy]
python_version = "3.13"
files = ["src/justkernel"]
strict = true
warn_unused_ignores = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
